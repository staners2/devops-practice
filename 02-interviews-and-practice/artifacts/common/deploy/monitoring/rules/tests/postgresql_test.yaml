    {
      "name": "failed old job resolves after newer success",
      "interval": "1m",
      "input_series": [
        {
          "series": "kube_job_created{job_name=\"old\",cluster=\"devops-practice\",namespace=\"platform\"}",
          "values": "1x12"
        },
        {
          "series": "kube_job_owner{job_name=\"old\",owner_kind=\"CronJob\",owner_name=\"postgresql-backup\",cluster=\"devops-practice\",namespace=\"platform\"}",
          "values": "1x12"
        },
        {
          "series": "kube_job_status_failed{job_name=\"old\",cluster=\"devops-practice\",namespace=\"platform\"}",
          "values": "1x12"
        },
        {
          "series": "kube_job_created{job_name=\"new\",cluster=\"devops-practice\",namespace=\"platform\"}",
          "values": "_ _ _ _ 240x8"
        },
        {
          "series": "kube_job_owner{job_name=\"new\",owner_kind=\"CronJob\",owner_name=\"postgresql-backup\",cluster=\"devops-practice\",namespace=\"platform\"}",
          "values": "_ _ _ _ 1x8"
        },
        {
          "series": "kube_job_status_failed{job_name=\"new\",cluster=\"devops-practice\",namespace=\"platform\"}",
          "values": "_ _ _ _ 0x8"
        }
      ],
      "alert_rule_test": [
        {
          "alertname": "PostgreSQLBackupFailed",
          "eval_time": "2m",
          "exp_alerts": [
            {
              "exp_labels": {
                "cluster": "devops-practice",
                "namespace": "platform",
                "service": "postgresql",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Последний backup Job завершился с ошибкой",
                "description": "Проверьте stdout Job, место на backup PVC и checksum. Новый успешный Job должен снять сигнал старой ошибки.",
                "dashboard_url": "http://localhost:3000/d/postgresql-operations",
                "runbook_url": "docs/runbooks/postgresql-operations.md#мониторинг-и-alerts"
              }
            }
          ],
          "groupname": "postgresql-alerts"
        },
        {
          "alertname": "PostgreSQLBackupFailed",
          "eval_time": "5m",
          "exp_alerts": [],
          "groupname": "postgresql-alerts"
        }
