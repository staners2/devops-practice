apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-restore
  namespace: platform
spec:
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql-restore
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: restore
          image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
          command: ["/bin/sh", "/scripts/restore.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          envFrom:
            - secretRef: {name: postgresql-maintenance-auth}
          env:
            - {name: EXPECTED_PGHOST, value: postgresql.platform.svc.cluster.local}
            - {name: BACKUP_DIR, value: /backups}
            - {name: BACKUP_ID, value: ""}
            - {name: RESTORE_DATABASE, value: ""}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: backups, mountPath: /backups, readOnly: true}
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: backups
          persistentVolumeClaim: {claimName: postgresql-backups}
        - name: scripts
          configMap: {name: postgresql-maintenance-scripts}
        - name: temporary
          emptyDir: {}
