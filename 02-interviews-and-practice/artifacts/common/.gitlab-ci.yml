workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $CI_COMMIT_BRANCH =~ /^gitops\/development-[0-9a-f]{40}$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - validate
  - test
  - security
  - build
  - verify
  - publish
  - promote
  - deploy

.application-rules: &application-rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^gitops\/development-[0-9a-f]{40}$/'
  - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    changes: &application-paths
      - "**/*.go"
      - go.mod
      - go.sum
      - migrations/**/*
      - Dockerfile
      - deploy/helm/**/*
      - scripts/ci/**/*
      - scripts/postgresql/**/*
      - containers/patroni/**/*
      - deploy/postgresql/**/*
      - .gitlab-ci.yml

.postgresql-rules: &postgresql-rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^gitops\/development-[0-9a-f]{40}$/'
  - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    changes: &postgresql-paths
      - internal/postgres/**/*
      - internal/config/**/*
      - internal/observability/**/*
      - cmd/migrate/**/*
      - migrations/**/*
      - containers/patroni/**/*
      - Dockerfile
      - deploy/helm/**/*
      - deploy/postgresql/**/*
      - deploy/patroni/**/*
      - deploy/environments/restore/**/*
      - deploy/environments/maintenance/**/*
      - deploy/argocd/**/*
      - deploy/monitoring/**/*
      - deploy/platform/**/*
      - scripts/postgresql/**/*
      - scripts/ci/**/*
      - docs/modules/05-postgresql.md
      - docs/runbooks/postgresql-operations.md
      - docs/runbooks/patroni.md
      - .gitlab-ci.yml

default:
  image: golang:1.26.4-bookworm@sha256:b305420a68d0f229d91eb3b3ed9e519fcf2cf5461da4bef997bf927e8c0bfd2b
  interruptible: true
  timeout: 15m
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-build/
      - .cache/go-mod/
    policy: pull-push
  before_script:
    - mkdir -p "$GOCACHE" "$GOMODCACHE"
  tags:
    - k8s

variables:
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOTOOLCHAIN: local

repository:
  stage: validate
  script:
    - git show --check --format= "$CI_COMMIT_SHA"

gitops:
  stage: validate
  image:
    name: alpine/k8s:1.35.0@sha256:18bc02c1e0df04451f4f9194eb7b7341c1165da5495459b52f85f72fb9545032
    entrypoint: [""]
  before_script: []
  variables:
    GITOPS_REPO_URL: $CI_PROJECT_URL.git
  script:
    - apk add --no-cache curl git jq skopeo
    - ./scripts/ci/validate-gitops.sh
    - ./scripts/ci/tests/promote-development_test.sh
    - ./scripts/ci/tests/verify-development_test.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $CI_COMMIT_BRANCH =~ /^gitops\/development-[0-9a-f]{40}$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^gitops\/development-[0-9a-f]{40}$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - deploy/argocd/**/*
        - deploy/environments/development/values.yaml
        - deploy/environments/restore/**/*
        - deploy/environments/maintenance/**/*
        - scripts/ci/*gitops*.sh
        - scripts/ci/promote-development.sh
        - scripts/ci/verify-development.sh
        - scripts/ci/tests/**/*

format:
  stage: validate
  rules: *application-rules
  script:
    - test -z "$(gofmt -l .)"

postgresql:
  stage: validate
  rules: *postgresql-rules
  timeout: 30m
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends unzip jq ca-certificates python3-yaml shellcheck
    - ./scripts/ci/validate-observability.sh
    - ./scripts/ci/validate-postgresql.sh
  artifacts:
    expire_in: 1 day
    paths:
      - .cache/rendered/postgresql/

postgresql-integration:
  stage: test
  rules: *postgresql-rules
  services:
    - name: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
      alias: postgres
      variables:
        POSTGRES_USER: devops
        POSTGRES_PASSWORD: devops_ci_only
        POSTGRES_DB: devops_practice_test
  variables:
    PG_MIGRATION_TEST_DATABASE_URL: postgres://devops:devops_ci_only@postgres:5432/devops_practice_test?sslmode=disable
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: devops
    PGDATABASE: devops_practice_test
    PGPASSWORD: devops_ci_only
  script:
    - go test -race -v ./cmd/migrate ./internal/postgres -run 'TestApplyConcurrentRepeatAndRollback|TestPoolOptionsWithPostgres' -count=1

postgresql-restore-integration:
  extends: postgresql-integration
  image:
    name: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    entrypoint: [""]
  before_script: []
  cache: []
  script:
    - sh scripts/postgresql/tests/integration_test.sh

observability:
  stage: validate
  timeout: 30m
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends unzip jq ca-certificates
    - ./scripts/ci/validate-observability.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^gitops\/development-[0-9a-f]{40}$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - internal/observability/**/*
        - internal/httpapi/**/*
        - internal/processor/**/*
        - cmd/api/**/*
        - cmd/worker/**/*
        - go.mod
        - go.sum
        - deploy/monitoring/**/*
        - deploy/platform/versions.env
        - deploy/platform/values/**/*
        - deploy/helm/**/*
        - scripts/ci/validate-observability.sh
        - .gitlab-ci.yml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .cache/rendered/observability/

vet:
  stage: validate
  rules: *application-rules
  script:
    - go vet ./...

compose:
  stage: validate
  rules: *application-rules
  image:
    name: docker:29.0.0-cli@sha256:87858a6dd14149240f4a2c33e0ec0f32a5ac1bb2548c04f5a20694ea25cb6157
    entrypoint: [""]
  before_script: []
  script:
    - docker compose --env-file env.example -f deploy/compose/compose.yaml config --quiet
    - TELEGRAM_BOT_TOKEN=ci-validation TELEGRAM_CHAT_ID=ci-validation docker compose --env-file deploy/notifier/env.example -f deploy/notifier/compose.yaml config --quiet

helm:
  stage: validate
  rules: *application-rules
  image:
    name: alpine/k8s:1.35.0@sha256:18bc02c1e0df04451f4f9194eb7b7341c1165da5495459b52f85f72fb9545032
    entrypoint: [""]
  before_script: []
  script:
    - helm lint deploy/helm/devops-practice --strict
    - mkdir -p .cache/rendered
    - helm template devops-practice deploy/helm/devops-practice --namespace devops-practice > .cache/rendered/devops-practice.yaml
    - '! grep -Eq ''namespace:[[:space:]]+(default|devops-practice)'' .cache/rendered/devops-practice.yaml'
    - '! grep -Eq ''image:[[:space:]].*:[l]atest([[:space:]]|$)'' .cache/rendered/devops-practice.yaml'
  artifacts:
    expire_in: 1 week
    paths:
      - .cache/rendered/devops-practice.yaml

kubeconform:
  stage: validate
  rules: *application-rules
  image:
    name: ghcr.io/yannh/kubeconform:v0.8.0-alpine@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f
    entrypoint: [""]
  before_script: []
  needs:
    - job: helm
      artifacts: true
  script:
    - /kubeconform -strict -summary -kubernetes-version 1.35.0 .cache/rendered/devops-practice.yaml

kube-linter:
  stage: validate
  rules: *application-rules
  image:
    name: ghcr.io/stackrox/kube-linter:v0.8.3@sha256:f2bfce7879206d32f69ab6572c376f916643f54ca291ac38cf7d01ef591ff3f9
    entrypoint: [""]
  before_script: []
  needs:
    - job: helm
      artifacts: true
  script:
    - /kube-linter lint .cache/rendered/devops-practice.yaml

test:
  stage: test
  rules: *application-rules
  script:
    - go test -race -coverprofile=coverage.out ./...
  coverage: '/coverage: ([0-9]+\.[0-9]+)% of statements/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage.out

golangci-lint:
  stage: test
  rules: *application-rules
  image:
    name: golangci/golangci-lint:v2.14.0-alpine@sha256:25925c95ebdc7aee39ecc0e6f4f33ac27b9a91718bc65fdf18a1a5c4c9325ee4
    entrypoint: [""]
  before_script: []
  script:
    - golangci-lint run --timeout=5m

govulncheck:
  stage: security
  rules: *application-rules
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

gosec:
  stage: security
  rules: *application-rules
  script:
    - go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -fmt sarif -out gosec.sarif ./...
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gosec.sarif

gitleaks:
  stage: security
  rules:
    - when: on_success
  image:
    name: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  before_script: []
  script:
    - gitleaks git --redact --report-format json --report-path gitleaks.json .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gitleaks.json

hadolint:
  stage: security
  rules: *postgresql-rules
  image:
    name: hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
    entrypoint: [""]
  before_script: []
  script:
    - hadolint Dockerfile
    - hadolint containers/patroni/Dockerfile

build-image:
  stage: build
  rules: *application-rules
  image:
    name: moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    entrypoint: [""]
  before_script: []
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  script:
    - ./scripts/ci/build-image.sh
  artifacts:
    expire_in: 1 day
    paths:
      - image.oci.tar

build-patroni:
  extends: build-image
  rules: *postgresql-rules
  timeout: 30m
  needs:
    - job: postgresql
      artifacts: true
    - job: gitleaks
      artifacts: false
    - job: hadolint
      artifacts: false
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    BUILD_CONTEXT: containers/patroni
    DOCKERFILE_DIR: containers/patroni
    OCI_ARTIFACT: patroni-image.oci.tar
    TARGET_IMAGE: $CI_REGISTRY_IMAGE/patroni
    BUILD_PLATFORMS: linux/amd64,linux/arm64
  script:
    - cp .cache/rendered/postgresql/patroni.yaml containers/patroni/validation.yaml
    - ./scripts/ci/build-image.sh
  artifacts:
    expire_in: 1 day
    paths:
      - patroni-image.oci.tar

scan-image:
  stage: verify
  rules: *application-rules
  image:
    name: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    entrypoint: [""]
  before_script: []
  needs:
    - job: build-image
      artifacts: true
  cache:
    key: trivy-db-v1
    paths:
      - .cache/trivy/
  variables:
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.cache/trivy
  script:
    - trivy image --input image.oci.tar --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy.json

sbom:
  stage: verify
  rules: *application-rules
  image:
    name: anchore/syft:v1.54.0@sha256:0356562f495d432056237fbea5cbc2d4839c9c75cd500784a66de2e7cc95ca7c
    entrypoint: [""]
  before_script: []
  needs:
    - job: build-image
      artifacts: true
  script:
    - syft oci-archive:image.oci.tar -o cyclonedx-json=sbom.cdx.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - sbom.cdx.json

split-patroni:
  extends: publish-image
  stage: verify
  rules: *postgresql-rules
  needs:
    - job: build-patroni
      artifacts: true
  script:
    - ./scripts/ci/split-patroni-images.sh
  artifacts:
    expire_in: 1 day
    paths:
      - patroni-amd64.tar
      - patroni-arm64.tar

scan-patroni:
  extends: scan-image
  rules: *postgresql-rules
  needs:
    - job: split-patroni
      artifacts: true
  script:
    - trivy image --input patroni-amd64.tar --severity HIGH,CRITICAL --exit-code 1 --format json --output patroni-trivy-amd64.json
    - trivy image --input patroni-arm64.tar --severity HIGH,CRITICAL --exit-code 1 --format json --output patroni-trivy-arm64.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - patroni-trivy-*.json

sbom-patroni:
  extends: sbom
  rules: *postgresql-rules
  needs:
    - job: split-patroni
      artifacts: true
  script:
    - syft docker-archive:patroni-amd64.tar -o cyclonedx-json=patroni-sbom-amd64.cdx.json
    - syft docker-archive:patroni-arm64.tar -o cyclonedx-json=patroni-sbom-arm64.cdx.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - patroni-sbom-*.cdx.json

smoke:
  stage: verify
  rules: *application-rules
  timeout: 10m
  services:
    - name: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
      alias: postgres
      variables:
        POSTGRES_USER: devops
        POSTGRES_PASSWORD: devops_ci_only
        POSTGRES_DB: devops_practice
    - name: redis:8.4-alpine@sha256:0514fa59e3d84e2f3be66731c5401fc2a85b8ea71b49c0116c850f6a558076f4
      alias: redis
    - name: apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
      alias: kafka
      variables:
        CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        KAFKA_NODE_ID: "1"
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  variables:
    DATABASE_URL: postgres://devops:devops_ci_only@postgres:5432/devops_practice?sslmode=disable
    REDIS_ADDR: redis:6379
    KAFKA_BROKERS: kafka:9092
    KAFKA_TOPIC: requests.created.v1
    KAFKA_GROUP: request-worker-ci
    CACHE_TTL: 30s
    REQUEST_TIMEOUT: 2s
    SHUTDOWN_TIMEOUT: 10s
    HTTP_ADDR: :8080
    API_BASE_URL: http://127.0.0.1:8080
  script:
    - mkdir -p bin
    - go build -o bin/api ./cmd/api
    - go build -o bin/worker ./cmd/worker
    - go build -o bin/migrate ./cmd/migrate
    - go build -o bin/smoke ./cmd/smoke
    - ./scripts/ci/smoke.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - api.log
      - worker.log

publish-image:
  stage: publish
  image:
    name: quay.io/skopeo/stable:v1.22.3-immutable@sha256:c0ee1f4edca5c01cb8d5611124f92f3cc47196ecab68aee5d0f90834e00574d5
    entrypoint: [""]
  before_script: []
  needs:
    - job: build-image
      artifacts: true
    - job: scan-image
    - job: sbom
    - job: smoke
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *application-paths
  script:
    - ./scripts/ci/publish-image.sh
  artifacts:
    expire_in: 1 week
    reports:
      dotenv: image.env
    paths:
      - image.env

publish-patroni:
  extends: publish-image
  needs:
    - job: build-patroni
      artifacts: true
    - job: scan-patroni
    - job: sbom-patroni
    - job: postgresql-integration
    - job: postgresql-restore-integration
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *postgresql-paths
  variables:
    OCI_ARTIFACT: patroni-image.oci.tar
    TARGET_IMAGE: $CI_REGISTRY_IMAGE/patroni
    IMAGE_ENV_FILE: patroni-image.env
    IMAGE_ENV_PREFIX: PATRONI_IMAGE
  artifacts:
    expire_in: 1 week
    reports:
      dotenv: patroni-image.env
    paths:
      - patroni-image.env

promote-development:
  stage: promote
  image:
    name: alpine/k8s:1.35.0@sha256:18bc02c1e0df04451f4f9194eb7b7341c1165da5495459b52f85f72fb9545032
    entrypoint: [""]
  before_script: []
  needs:
    - job: publish-image
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *application-paths
  script:
    - apk add --no-cache curl git jq skopeo
    - ./scripts/ci/promote-development.sh

verify-development:
  stage: deploy
  image:
    name: alpine/k8s:1.35.0@sha256:18bc02c1e0df04451f4f9194eb7b7341c1165da5495459b52f85f72fb9545032
    entrypoint: [""]
  before_script: []
  script:
    - apk add --no-cache jq
    - ./scripts/ci/verify-development.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - deploy/environments/development/values.yaml
  environment:
    name: development
    url: http://devops-practice.localhost:8080
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - smoke.log

terraform-static:
  stage: validate
  timeout: 20m
  image:
    name: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    entrypoint: [""]
  cache: []
  before_script: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'
      exists:
        - reference/module-08-terraform/*.tf
    - when: never
  script:
    - apk add --no-cache bash curl unzip python3
    - bash scripts/ci/install-terraform-tools.sh deploy/terraform-lab/versions.env /usr/local/bin
    - bash scripts/ci/validate-terraform.sh reference/module-08-terraform
    - trivy config --exit-code 1 --severity HIGH,CRITICAL reference/module-08-terraform
