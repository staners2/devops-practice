version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
