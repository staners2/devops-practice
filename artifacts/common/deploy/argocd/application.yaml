apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-practice
  namespace: argocd
spec:
  project: devops-practice
  sources:
    - repoURL: __GITOPS_REPO_URL__
      targetRevision: main
      path: deploy/helm/devops-practice
      helm:
        releaseName: devops-practice
        valueFiles:
          - $values/deploy/environments/development/values.yaml
    - repoURL: __GITOPS_REPO_URL__
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-practice
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
