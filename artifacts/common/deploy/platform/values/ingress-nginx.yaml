# ingress-nginx retired in March 2026 and receives no fixes.
# It is used only for this local lab; prefer a supported Gateway API implementation in production.
controller:
  replicaCount: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  service:
    type: LoadBalancer
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
