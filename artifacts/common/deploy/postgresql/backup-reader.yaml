apiVersion: v1
kind: Pod
metadata:
  name: postgresql-backup-reader
  namespace: platform
  labels:
    app.kubernetes.io/name: postgresql-restore
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: reader
      image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
      command: ["/bin/sh", "-c", "sleep 3600"]
      envFrom:
        - secretRef: {name: postgresql-maintenance-auth}
      env:
        - {name: BACKUP_DIR, value: /backups}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 5m, memory: 16Mi}
        limits: {cpu: 50m, memory: 64Mi}
      volumeMounts:
        - {name: backups, mountPath: /backups, readOnly: true}
        - {name: scripts, mountPath: /scripts, readOnly: true}
        - {name: temporary, mountPath: /tmp}
  volumes:
    - name: backups
      persistentVolumeClaim: {claimName: postgresql-backups}
    - name: scripts
      configMap: {name: postgresql-maintenance-scripts}
    - name: temporary
      emptyDir: {}
