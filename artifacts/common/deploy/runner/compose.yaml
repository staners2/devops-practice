services:
  runner:
    image: gitlab/gitlab-runner:alpine-v19.4.1@sha256:4da99e249eb79dc86a27af77b5c5d6cc46445c802b29294441081ae27410159a
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ${DOCKER_HOST_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - runner-config:/etc/gitlab-runner
      - runner-cache:/cache

  notifier:
    build:
      context: ../..
      target: notifier
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 64m
    environment:
      GITLAB_API_URL: ${GITLAB_API_URL:-https://gitlab.com/api/v4}
      GITLAB_PROJECT_ID: ${GITLAB_PROJECT_ID:?set GITLAB_PROJECT_ID}
      GITLAB_READ_TOKEN: ${GITLAB_READ_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID}
      NOTIFIER_POLL_INTERVAL: ${NOTIFIER_POLL_INTERVAL:-15s}
      NOTIFIER_STATE_PATH: /var/lib/notifier/state.json
    volumes:
      - notifier-state:/var/lib/notifier
    security_opt:
      - no-new-privileges:true

volumes:
  runner-config:
    name: devops-practice-runner-config
  runner-cache:
    name: devops-practice-runner-cache
  notifier-state:
    name: devops-practice-notifier-state
