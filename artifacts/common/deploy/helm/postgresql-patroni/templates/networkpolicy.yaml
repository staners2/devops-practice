apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-patroni
  labels:
    {{- include "postgresql-patroni.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "postgresql-patroni.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: devops-practice}
          podSelector:
            matchLabels: {app.kubernetes.io/name: devops-practice}
        - podSelector:
            matchLabels:
              {{- include "postgresql-patroni.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: postgresql-backup}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: postgresql-restore}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus-postgres-exporter}
      ports:
        - {protocol: TCP, port: 5432}
    - from:
        - podSelector:
            matchLabels:
              {{- include "postgresql-patroni.selectorLabels" . | nindent 14 }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 8008}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              {{- include "postgresql-patroni.selectorLabels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 8008}
    - to:
        {{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
