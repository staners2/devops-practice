---
- name: Создать каталог ключей apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Получить ключ официального repository Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'

- name: Настроить официальный repository Docker
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: noble
      Components: stable
      Architectures: {{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}
      Signed-By: /etc/apt/keyrings/docker.asc
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: '0644'
  register: docker_repository

- name: Установить закреплённую версию Docker Engine
  ansible.builtin.apt:
    name:
      - "docker-ce={{ lab_versions['DOCKER_APT_VERSION'] }}"
      - "docker-ce-cli={{ lab_versions['DOCKER_APT_VERSION'] }}"
      - containerd.io
    state: present
    update_cache: "{{ docker_repository.changed }}"

- name: Создать каталог системных CLI plugins
  ansible.builtin.file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Установить Compose plugin с проверкой SHA256
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/v{{ lab_versions['COMPOSE_VERSION'] }}/docker-compose-linux-{{ ansible_facts['architecture'] }}"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    checksum: "sha256:{{ lab_versions['COMPOSE_SHA256_AMD64'] if ansible_facts['architecture'] == 'x86_64' else lab_versions['COMPOSE_SHA256_ARM64'] }}"
    owner: root
    group: root
    mode: '0755'

- name: Включить и запустить Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
