workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - validate
  - test
  - security
  - build
  - verify
  - publish

default:
  image: golang:1.26.4-bookworm@sha256:b305420a68d0f229d91eb3b3ed9e519fcf2cf5461da4bef997bf927e8c0bfd2b
  interruptible: true
  timeout: 15m
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-build/
      - .cache/go-mod/
    policy: pull-push
  before_script:
    - mkdir -p "$GOCACHE" "$GOMODCACHE"

variables:
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOTOOLCHAIN: local

format:
  stage: validate
  script:
    - test -z "$(gofmt -l .)"

vet:
  stage: validate
  script:
    - go vet ./...

compose:
  stage: validate
  image:
    name: docker:29.0.0-cli@sha256:87858a6dd14149240f4a2c33e0ec0f32a5ac1bb2548c04f5a20694ea25cb6157
    entrypoint: [""]
  before_script: []
  script:
    - docker compose --env-file .env.example -f deploy/compose/compose.yaml config --quiet
    - TELEGRAM_BOT_TOKEN=ci-validation TELEGRAM_CHAT_ID=ci-validation docker compose --env-file deploy/runner/.env.example -f deploy/runner/compose.yaml config --quiet

test:
  stage: test
  script:
    - go test -race -coverprofile=coverage.out ./...
  coverage: '/coverage: ([0-9]+\.[0-9]+)% of statements/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage.out

golangci-lint:
  stage: test
  image:
    name: golangci/golangci-lint:v2.14.0-alpine@sha256:25925c95ebdc7aee39ecc0e6f4f33ac27b9a91718bc65fdf18a1a5c4c9325ee4
    entrypoint: [""]
  before_script: []
  script:
    - golangci-lint run --timeout=5m

govulncheck:
  stage: security
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

gosec:
  stage: security
  script:
    - go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -fmt sarif -out gosec.sarif ./...
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gosec.sarif

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  before_script: []
  script:
    - gitleaks git --redact --report-format json --report-path gitleaks.json .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gitleaks.json

hadolint:
  stage: security
  image:
    name: hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
    entrypoint: [""]
  before_script: []
  script:
    - hadolint Dockerfile

build-image:
  stage: build
  image:
    name: moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    entrypoint: [""]
  before_script: []
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  script:
    - ./scripts/ci/build-image.sh
  artifacts:
    expire_in: 1 day
    paths:
      - image.oci.tar

scan-image:
  stage: verify
  image:
    name: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    entrypoint: [""]
  before_script: []
  needs:
    - job: build-image
      artifacts: true
  cache:
    key: trivy-db-v1
    paths:
      - .cache/trivy/
  variables:
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.cache/trivy
  script:
    - trivy image --input image.oci.tar --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy.json

sbom:
  stage: verify
  image:
    name: anchore/syft:v1.54.0@sha256:0356562f495d432056237fbea5cbc2d4839c9c75cd500784a66de2e7cc95ca7c
    entrypoint: [""]
  before_script: []
  needs:
    - job: build-image
      artifacts: true
  script:
    - syft oci-archive:image.oci.tar -o cyclonedx-json=sbom.cdx.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - sbom.cdx.json

smoke:
  stage: verify
  timeout: 10m
  services:
    - name: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
      alias: postgres
      variables:
        POSTGRES_USER: devops
        POSTGRES_PASSWORD: devops_ci_only
        POSTGRES_DB: devops_practice
    - name: redis:8.4-alpine@sha256:0514fa59e3d84e2f3be66731c5401fc2a85b8ea71b49c0116c850f6a558076f4
      alias: redis
    - name: apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
      alias: kafka
      variables:
        CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        KAFKA_NODE_ID: "1"
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  variables:
    DATABASE_URL: postgres://devops:devops_ci_only@postgres:5432/devops_practice?sslmode=disable
    REDIS_ADDR: redis:6379
    KAFKA_BROKERS: kafka:9092
    KAFKA_TOPIC: requests.created.v1
    KAFKA_GROUP: request-worker-ci
    CACHE_TTL: 30s
    REQUEST_TIMEOUT: 2s
    SHUTDOWN_TIMEOUT: 10s
    HTTP_ADDR: :8080
    API_BASE_URL: http://127.0.0.1:8080
  script:
    - mkdir -p bin
    - go build -o bin/api ./cmd/api
    - go build -o bin/worker ./cmd/worker
    - go build -o bin/migrate ./cmd/migrate
    - go build -o bin/smoke ./cmd/smoke
    - ./scripts/ci/smoke.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - api.log
      - worker.log

publish-image:
  stage: publish
  image:
    name: quay.io/skopeo/stable:v1.22.3-immutable@sha256:c0ee1f4edca5c01cb8d5611124f92f3cc47196ecab68aee5d0f90834e00574d5
    entrypoint: [""]
  before_script: []
  needs:
    - job: build-image
      artifacts: true
    - job: scan-image
    - job: sbom
    - job: smoke
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - ./scripts/ci/publish-image.sh
  artifacts:
    expire_in: 1 week
    reports:
      dotenv: image.env
    paths:
      - image.env
